name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Generate data and build the warehouse in SQL Server
    runs-on: ubuntu-latest
    env:
      SA_PASSWORD: CiOnly_Passw0rd!   # throwaway container, only exists during this job

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"   # the minimum the generator supports
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Test the generator
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pytest -q

      - name: Committed data must match the generator
        run: |
          python generator/generate_data.py
          if [ -n "$(git status --porcelain -- datasets)" ]; then
            git status --short -- datasets
            echo "datasets/ differs from what generator/generate_data.py writes (seed 42). Regenerate and commit."
            exit 1
          fi

      - name: Start SQL Server 2022
        run: |
          docker run -d --name mssql \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$SA_PASSWORD" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            mcr.microsoft.com/mssql/server:2022-latest
          for i in $(seq 1 30); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -Q "SELECT 1" > /dev/null 2>&1; then
              echo "SQL Server is ready"; exit 0
            fi
            sleep 2
          done
          docker logs mssql; exit 1

      - name: Build bronze, silver and gold
        run: |
          sql() { docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b "$@"; }
          sql -i /repo/scripts/database.sql
          sql -d LogisticsDW -i /repo/scripts/bronze/bronze.sql
          sql -d LogisticsDW -i /repo/scripts/silver/silver.sql
          sql -d LogisticsDW -i /repo/scripts/gold/gold.sql
          # Loaded twice on purpose: a second run must not duplicate anything.
          # The trailing slash on the path is on purpose too.
          for run in 1 2; do
            sql -d LogisticsDW -Q "EXEC bronze.load_bronze @data_path = N'/repo/datasets/';"
            sql -d LogisticsDW -Q "EXEC silver.load_silver;"
          done

      - name: Check the results
        run: |
          sql() { docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$SA_PASSWORD" -C -b "$@"; }
          sql -d LogisticsDW -v DataPath=/repo/datasets -i /repo/tests/ci_assertions.sql
          sql -d LogisticsDW -i /repo/tests/quality_checks_silver.sql -o /dev/null
          sql -d LogisticsDW -i /repo/tests/quality_checks_gold.sql -o /dev/null
          sql -d LogisticsDW -Q "SELECT TOP 8 carrier_code, zone_code, ship_month, shipments, on_time_pct FROM gold.rpt_carrier_performance ORDER BY ship_month DESC, carrier_code, zone_code;"
